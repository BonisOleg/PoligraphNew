{% load static %}<!DOCTYPE html>
<html lang="uk" class="h-full">
<head>
    <!-- Google Tag Manager -->

    <!-- End Google Tag Manager -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <meta name="description" content="Дякуємо за заявку. Ми зв'яжемося з вами найближчим часом. Перевірка на зраду - детектор брехні Львів.">
    <meta name="robots" content="noindex, follow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/infidelity-landing.css' %}">
    {% csrf_token %}
</head>
<body class="infidelity-body">
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-WHRVL87G"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <div class="infidelity-wrapper">
        <div class="infidelity-background">
            <div class="infidelity-background__glow infidelity-background__glow--1"></div>
            <div class="infidelity-background__glow infidelity-background__glow--2"></div>
            <div class="infidelity-background__glow infidelity-background__glow--3"></div>
        </div>

        <nav class="infidelity-nav">
            <div class="infidelity-nav__container">
                <div class="infidelity-nav__brand">
                    <span class="infidelity-nav__emoji">💔</span>
                    <div>
                        <span class="infidelity-nav__title">ДЕТЕКТОР БРЕХНІ</span>
                        <span class="infidelity-nav__subtitle">ПЕРЕВІРКА НА ЗРАДУ</span>
                    </div>
                </div>
                <a href="tel:{{ phone }}" class="infidelity-nav__phone">
                    <svg class="infidelity-nav__phone-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
                    </svg>
                    <span>Зателефонувати</span>
                </a>
            </div>
        </nav>

        <section class="infidelity-form-section infidelity-form-section--thanks">
            <div class="infidelity-form-container">
                <div class="infidelity-form-glow"></div>
                <div class="infidelity-form__card">
                    <div class="infidelity-form__success infidelity-form__success--page">
                        <div class="infidelity-form__success-icon">✓</div>
                        <h1 class="infidelity-form__success-title">Дякуємо за заявку!</h1>
                        <p class="infidelity-form__success-text">Ваша заявка отримана. Ми зв'яжемося з вами найближчим часом.</p>
                        <a href="{% url 'pages:infidelity_landing' %}" class="infidelity-button infidelity-button--secondary infidelity-form__success-back">Повернутися на сторінку</a>
                    </div>
                </div>
            </div>
        </section>

        <footer class="infidelity-footer">
            <div class="infidelity-footer__content">
                <div class="infidelity-footer__brand">
                    <span class="infidelity-footer__emoji">💔</span>
                    <span class="infidelity-footer__text">ДЕТЕКТОР БРЕХНІ</span>
                </div>
                <p class="infidelity-footer__copyright">© {% now "Y" %} Поліграф Львів. Всі права захищено.</p>
            </div>
        </footer>
    </div>
</body>
</html>
